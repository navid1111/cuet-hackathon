name: CD

on:
  # Trigger after CI passes on main
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

  # Manual trigger
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>&1 || true

      - name: Deploy to VM
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          scp -i ~/.ssh/deploy_key.pem docker/compose.prod.yml "${SSH_USER}@${SSH_HOST}:/opt/delineate/compose.prod.yml"
          ssh -i ~/.ssh/deploy_key.pem "${SSH_USER}@${SSH_HOST}" "cd /opt/delineate && export DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME} && docker compose -f compose.prod.yml pull && docker compose -f compose.prod.yml up -d && docker image prune -f"

      - name: Health Check
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "Waiting for service to start..."
          sleep 20
          ssh -i ~/.ssh/deploy_key.pem "${SSH_USER}@${SSH_HOST}" "cd /opt/delineate && docker compose ps"
          ssh -i ~/.ssh/deploy_key.pem "${SSH_USER}@${SSH_HOST}" "curl -sf http://localhost:3000/health && echo 'Deployment successful!' || echo 'Health check failed'"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key.pem
